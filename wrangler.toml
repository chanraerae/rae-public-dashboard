name = "rae-link-dashboard"
main = "src/index.js"
compatibility_date = "2026-11-10"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "dashboard.diverseonpurpose.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "rae_dashboard_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
