name = "rae-public-dashboard"
main = "src/index.js"
compatibility_date = "2026-11-10"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "dashboard.diverseonpurpose.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "rae_dashboard_db"
database_id = "c3c00b9b-fe5c-4baf-9bb0-d230b92be5bc"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
